# Plantilla Nginx (host). Sustituir ${DOMINIO} y ${FRONTEND_DIST} al desplegar.
# ${FRONTEND_DIST} = ruta absoluta a frontend/dist/ (build con pnpm fuera de Docker).
# Certificados: certbot --nginx (o colocar fullchain/privkey en las rutas de abajo).

# 11m = default de spring.servlet.multipart.max-request-size
# (${MAX_UPLOAD_REQUEST_SIZE:11MB} en application.properties).

server {
    listen 80;
    listen [::]:80;
    server_name ${DOMINIO};

    client_max_body_size 11m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${DOMINIO};

    client_max_body_size 11m;

    # Rutas estandar de Certbot; el certificado se agrega despues.
    ssl_certificate     /etc/letsencrypt/live/${DOMINIO}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMINIO}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root ${FRONTEND_DIST};
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

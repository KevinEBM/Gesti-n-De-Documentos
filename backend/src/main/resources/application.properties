spring.application.name=gestion-documental
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
storage.location=${STORAGE_LOCATION:uploads}
storage.max-file-size-bytes=${STORAGE_MAX_FILE_SIZE:15728640}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:15MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:16MB}

spring.application.name=gestion-documental

server.port=${PORT:8080}

# JWT stateless: no se usa UserDetailsService en memoria de Spring Boot.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
storage.location=${STORAGE_LOCATION:uploads}
storage.max-file-size-bytes=${STORAGE_MAX_FILE_SIZE:10485760}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:11MB}

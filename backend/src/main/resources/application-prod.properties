# Perfil producción — activar con SPRING_PROFILES_ACTIVE=prod (o --spring.profiles.active=prod).
# Solo contiene diferencias respecto a application.properties (desarrollo local).

# CORS: sin default localhost; debe definirse en el entorno del servidor.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Storage persistente: ruta absoluta obligatoria en producción.
storage.location=${STORAGE_LOCATION}

# Errores HTTP: no exponer stack traces ni detalles internos al cliente.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Logging más restrictivo.
logging.level.root=WARN
logging.level.com.plantarsas=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Recomendado detrás de reverse proxy HTTPS (configuración en A7).
server.forward-headers-strategy=framework

# OSIV desactivado: el acceso lazy ocurre dentro de @Transactional en servicios.
spring.jpa.open-in-view=false
